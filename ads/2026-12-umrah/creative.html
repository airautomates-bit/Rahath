<!doctype html>
<!--
  Meta ad creatives for the 16 Dec 2026 and 10 Jan 2027 groups.
  One file, four outputs, picked by query string:
    ?v=a|b  (a = Kaaba arches, b = Arshad guiding the group)
    ?s=feed|story  (feed = 1080x1350, story = 1080x1920)
  Render all four PNGs with:  node ads/2026-12-umrah/render.mjs
-->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../inter.css">
<style>
  :root {
    --navy: #0b1f3a;
    --ink: #080a0f;
    --blue: #1277da;
    --white: #ffffff;
    --amber: #f5b544;
    --green: #3ccf91;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--ink); }
  body { font-family: Inter, Arial, sans-serif; color: var(--white); }

  .ad { position: relative; width: 1080px; overflow: hidden; }
  .feed { height: 1350px; }
  .story { height: 1920px; }

  .photo { position: absolute; inset: 0; background-size: cover; background-position: center; }
  .shade {
    position: absolute; inset: 0;
    background:
      linear-gradient(180deg, rgba(8,10,15,.55) 0%, rgba(8,10,15,0) 18%),
      linear-gradient(180deg, rgba(11,31,58,0) 26%, rgba(11,31,58,.72) 44%, rgba(11,31,58,.94) 62%, rgba(11,31,58,.98) 100%);
  }

  .top { position: absolute; left: 64px; right: 64px; top: 60px; display: flex; justify-content: space-between; align-items: center; }
  .story .top { top: 210px; }
  .brand { display: flex; align-items: center; gap: 18px; font-weight: 700; font-size: 34px; letter-spacing: -.01em; }
  .brand i { width: 64px; height: 64px; border-radius: 16px; background: #10182a url("../../photos/logo-mark-tile.webp") center/cover; }
  .rating { background: rgba(255,255,255,.14); border: 1px solid rgba(255,255,255,.28); backdrop-filter: blur(8px);
            padding: 14px 24px; border-radius: 999px; font-size: 28px; font-weight: 600; }
  .rating b { color: var(--amber); }

  .body { position: absolute; left: 64px; right: 64px; bottom: 64px; }
  .story .body { bottom: 300px; }

  .eyebrow { font-size: 28px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.75); margin-bottom: 18px; }
  h1 { font-size: 84px; line-height: 1.02; font-weight: 800; letter-spacing: -.03em; margin-bottom: 24px; text-shadow: 0 4px 24px rgba(8,10,15,.45); }
  .sub { font-size: 32px; line-height: 1.35; color: rgba(255,255,255,.88); margin-bottom: 40px; max-width: 900px; }

  .dates { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 28px; }
  .date { background: var(--white); color: var(--ink); border-radius: 24px; padding: 26px 28px; }
  .date small { display: block; font-size: 24px; font-weight: 600; color: #697386; text-transform: uppercase; letter-spacing: .08em; }
  .date strong { display: block; font-size: 50px; font-weight: 800; letter-spacing: -.02em; color: var(--navy); margin: 4px 0 14px; }
  .tag { display: inline-flex; align-items: center; gap: 10px; font-size: 24px; font-weight: 700; padding: 8px 16px; border-radius: 999px; }
  .tag::before { content: ""; width: 12px; height: 12px; border-radius: 50%; background: currentColor; }
  .tag.few { background: #fff4de; color: #a8660a; }
  .tag.open { background: #ddf7ec; color: #0e7a4e; }

  .price { display: flex; justify-content: space-between; align-items: baseline; font-size: 30px; color: rgba(255,255,255,.85); margin-bottom: 28px; }
  .price b { font-size: 40px; color: var(--white); font-weight: 800; }

  .cta { display: flex; align-items: center; justify-content: center; gap: 18px; background: var(--blue); border-radius: 22px;
         padding: 30px; font-size: 38px; font-weight: 800; }
  .cta svg { width: 40px; height: 40px; }
</style>
</head>
<body>
<div id="ad" class="ad">
  <div class="photo" id="photo"></div>
  <div class="shade"></div>

  <div class="top">
    <div class="brand"><i></i>Rahath Tours &amp; Travels</div>
    <div class="rating"><b>★ 5.0</b> · 21 Google reviews</div>
  </div>

  <div class="body">
    <p class="eyebrow">Umrah from Sri Lanka</p>
    <h1 id="headline"></h1>
    <p class="sub" id="sub"></p>

    <div class="dates">
      <div class="date">
        <small>Departs</small>
        <strong>16 Dec 2026</strong>
        <span class="tag few">Few seats left</span>
      </div>
      <div class="date">
        <small>Departs</small>
        <strong>10 Jan 2027</strong>
        <span class="tag open">Seats open</span>
      </div>
    </div>

    <div class="price"><span>From <b>LKR 385,000</b> per person</span><span>10–11 days</span></div>

    <div class="cta">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>
      Call or WhatsApp 072 532 9242
    </div>
  </div>
</div>

<script>
  const q = new URLSearchParams(location.search);
  const variants = {
    a: {
      photo: "../../photos/kaaba-through-haram-arches.webp",
      headline: "First-time Umrah,<br>guided every step.",
      sub: "Visa, return flights, hotels near the Haram, Sri Lankan meals and Ziyarat. All included.",
    },
    b: {
      photo: "../../photos/arshad-guiding.webp",
      headline: "Guided by a teacher,<br>Colombo to Makkah.",
      sub: "Arshad Moulavi travels with the group and explains every ritual, so nobody is left guessing.",
    },
  };
  const v = variants[q.get("v")] || variants.a;
  document.getElementById("ad").classList.add(q.get("s") === "story" ? "story" : "feed");
  document.getElementById("photo").style.backgroundImage = `url("${v.photo}")`;
  document.getElementById("headline").innerHTML = v.headline;
  document.getElementById("sub").textContent = v.sub;
</script>
</body>
</html>
